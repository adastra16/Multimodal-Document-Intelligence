services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - mdi_data:/app/backend/data
    environment:
      - APP_ENV=production
      - OCR_COMMAND=tesseract
      - OCR_LANGUAGE=eng
      - OCR_DPI=220
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mdi_data:
